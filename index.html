<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageRot UI // five.sh</title>
    <meta name="description" content="Datamosher is an online tool that will add different effects to your images. It's free and easy to use.">
    <meta name="keywords" content="datamosh effects generator jpeg jpg image images convert converter effects eyy free tool online">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:image" content="https://five.sh/imagerot/ui/assets/card.png?v=1">
    <link rel="stylesheet" href="./css/rotUi.css">
</head>
<body>
    <div class="content">
        <div class="wrapper">
            <div class="image">
                <img id="output" src="/imagerot/ui/assets/cover.jpg" onload="this.style.opacity = 1;" />

                <div class="options">
                    <div class="fileReset" title="Reset image"></div>
                    <div class="fileOpen" title="Open in new tab"></div>
                    <div class="fileSave" title="Save file"></div>
                </div>
            </div>

            <div class="selector">
                <div class="top">
                    <div class="help button">?</div>

                    <div class="mainHeader">
                        <h2>ImageRot UI</h2>
                        <div class="note">
                            <span>Check out the project on <a target="_blank" href="https://github.com/sixem/imagerot/">GitHub</a></span>
                            <svg fill="currentColor" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M16 1.375c-8.282 0-14.996 6.714-14.996 14.996 0 6.585 4.245 12.18 10.148 14.195l0.106 0.031c0.75 0.141 1.025-0.322 1.025-0.721 0-0.356-0.012-1.3-0.019-2.549-4.171 0.905-5.051-2.012-5.051-2.012-0.288-0.925-0.878-1.685-1.653-2.184l-0.016-0.009c-1.358-0.93 0.105-0.911 0.105-0.911 0.987 0.139 1.814 0.718 2.289 1.53l0.008 0.015c0.554 0.995 1.6 1.657 2.801 1.657 0.576 0 1.116-0.152 1.582-0.419l-0.016 0.008c0.072-0.791 0.421-1.489 0.949-2.005l0.001-0.001c-3.33-0.375-6.831-1.665-6.831-7.41-0-0.027-0.001-0.058-0.001-0.089 0-1.521 0.587-2.905 1.547-3.938l-0.003 0.004c-0.203-0.542-0.321-1.168-0.321-1.821 0-0.777 0.166-1.516 0.465-2.182l-0.014 0.034s1.256-0.402 4.124 1.537c1.124-0.321 2.415-0.506 3.749-0.506s2.625 0.185 3.849 0.53l-0.1-0.024c2.849-1.939 4.105-1.537 4.105-1.537 0.285 0.642 0.451 1.39 0.451 2.177 0 0.642-0.11 1.258-0.313 1.83l0.012-0.038c0.953 1.032 1.538 2.416 1.538 3.937 0 0.031-0 0.061-0.001 0.091l0-0.005c0 5.761-3.505 7.029-6.842 7.398 0.632 0.647 1.022 1.532 1.022 2.509 0 0.093-0.004 0.186-0.011 0.278l0.001-0.012c0 2.007-0.019 3.619-0.019 4.106 0 0.394 0.262 0.862 1.031 0.712 6.028-2.029 10.292-7.629 10.292-14.226 0-8.272-6.706-14.977-14.977-14.977-0.006 0-0.013 0-0.019 0h0.001z"></path></svg>
                        </div>
                    </div>
            
                    <div class="fileInput uiSection">
                        <div class="subHeader">File selection:</div>
                        <input type="file" accept="image/png, image/jpeg, image/webp, image/avif">
                    </div>

                    <div class="modeAdd uiSection">
                        <div class="subHeader">Available modes:</div>
                        
                        <div class="selectButtonSet">
                            <select name="modeSelect" id="modeSelect">
                                <option>Loading ...</option>
                            </select>
                            <div class="button">Add</div>
                        </div>

                        <div class="description"></div>
                    </div>

                    <div class="effectAdd uiSection">
                        <div class="subHeader">Available effects:</div>
                        
                        <select name="effectSelect" id="effectSelect">
                            <option>Loading ...</option>
                        </select>

                        <div class="effectConfig"></div>
                    </div>

                    <div class="workFlow uiSection">
                        <div class="subHeader">Active workflow items:</div>
                        <div class="workOrder workEmpty" id="workOrder"></div>
                    </div>
                </div>

                <div class="bottom">
                    <div class="button" id="generate">Process image</div>
                    
                    <div class="buttonSet">
                        <div class="button" id="export">Export workflow</div>
                        <div class="button" id="import">Import workflow</div>
                    </div>
                </div>
            </div>

            <div id="loading"></div>
            <div id="notify"></div>
        </div>
    </div>
    <script src="./js/FileSaver.min.js"></script>
    <script src="./js/Sortable.min.js"></script>
    <script src="./js/jscolor.js"></script>
    <script src="./js/rotUi.js"></script>
</body>
</html>
