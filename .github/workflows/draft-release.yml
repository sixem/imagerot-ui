name: 'build-draft-release'

on: workflow_dispatch

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir web build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
  build-tauri:
    name: Build Tauri ${{ matrix.os }}
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact-name: windows-binary
            upload-path: |
              desktop/src-tauri/target/release/imagerot.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            artifact-name: linux-binary
            upload-path: desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            artifact-name: macos-binary
            upload-path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest' # Installs required libraries for Tauri builds on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
      - name: Upload ${{ matrix.os }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.upload-path }}

  create-draft-release:
    name: Create Draft Release
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
  
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
  
      - name: Compute release tag from root package.json
        id: tag
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read .version from root package.json" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
  
      - name: Create/Update draft release and upload assets
        run: |
          set -euo pipefail
      
          TAG="${{ steps.tag.outputs.tag }}"
      
          # Create (or edit) the draft release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "ImageRot UI build $TAG"
          else
            gh release create "$TAG" --draft --title "ImageRot UI build $TAG" --target "${GITHUB_SHA}"
          fi
      
          # Collect actual installer files across all OSes
          mapfile -d '' FILES < <(
            find artifacts -type f \
              \( -iname '*.msi' -o -iname '*.exe' -o -iname '*.dmg' \
                 -o -iname '*.zip' -o -iname '*.deb' -o -iname '*.rpm' -o -iname '*.AppImage' \) \
              -print0
          )
      
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release files found under artifacts/" >&2
            find artifacts -maxdepth 3 -type d -print
            exit 1
          fi
      
          # Upload everything; --clobber lets you re-run without errors
          gh release upload "$TAG" "${FILES[@]}" --clobber
